<style>html,body{margin:0;background:#000}iframe{display:block;border:0;margin:0 auto}</style>
<iframe id="f" src="/" width="390" height="2200"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  if (p.get('w')) f.width = p.get('w');
  if (p.get('h')) f.height = p.get('h');
  if (p.get('src')) f.src = p.get('src');
  f.addEventListener('load', () => {
    const d = f.contentDocument.documentElement;
    if (p.get('dir')) d.setAttribute('dir', p.get('dir'));
    if (p.get('rm')) d.setAttribute('data-force-reduced-motion', 'on');
  });
</script>
